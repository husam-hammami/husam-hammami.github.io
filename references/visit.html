<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102942">
<title>On location · Hammami Marble</title>
<link rel="icon" href="/brand/hammami/favicon-32.png">
<style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;color:#172839;background:#f6f4ee;font:16px/1.44 Arial,Tahoma,sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #bc823e;outline-offset:3px}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding-inline:clamp(17px,3.6vw,66px);background:#102942;color:#fff;border-bottom:1px solid #987848}.brand{font:500 24px/1 Georgia,serif;letter-spacing:.11em;display:flex;align-items:center;gap:12px;text-decoration:none}.brand img{width:38px;height:38px;object-fit:contain}.head-actions{display:flex;align-items:center;gap:clamp(12px,2.5vw,35px)}.lang{border:0;background:none;color:inherit;padding:10px 3px}.return{border:1px solid #ab9677;border-radius:3px;padding:9px 15px;color:#fff;text-decoration:none;font-size:14px}.return::after{content:'↗';padding-inline-start:.55em}html[dir=rtl] .return::after{content:'↖'}
main{min-height:calc(100svh - 70px);display:grid;grid-template-columns:minmax(300px,33%) minmax(0,1fr);padding:clamp(26px,3.35vw,58px);gap:clamp(28px,4vw,78px);max-width:1940px;margin-inline:auto}
aside{display:flex;flex-direction:column;justify-content:center;padding-block:10px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#69583f;display:flex;align-items:center;gap:12px;margin:0 0 20px}.eyebrow::before{content:'';width:31px;height:1px;background:#a27c46}h1{font:normal clamp(42px,4.45vw,83px)/1.04 Georgia,'Times New Roman',serif;letter-spacing:-.047em;margin:0 0 14px;color:#102942}html[dir=rtl] h1{font-family:Tahoma,Arial,sans-serif;letter-spacing:0;font-weight:600;line-height:1.25}.description{font-size:clamp(15px,1.12vw,20px);color:#43515b;margin:0;max-width:33ch}.views{margin-block-start:clamp(30px,5vh,64px);border-top:1px solid #cec8bc}
.views button{border:0;border-bottom:1px solid #cec8bc;background:none;color:#263849;width:100%;padding:10px 3px;display:flex;align-items:center;gap:15px;text-align:start;min-height:61px;font-size:15px}.views button[aria-pressed=true]{color:#112c49;font-weight:700}.views button[aria-pressed=true]::after{content:'●';margin-inline-start:auto;color:#a17943;font-size:10px;padding:8px}.thumb{width:55px;height:39px;flex:none;background-image:url(site-photos/thumbnails.webp);background-size:400% 100%;border-radius:2px}
figure{position:relative;margin:0;background:#d8d3ca;min-width:0;overflow:hidden;align-self:stretch;min-height:460px}picture{position:absolute;inset:0}picture img{height:100%;width:100%;display:block;object-fit:cover;object-position:50% var(--focus,57%)}.credit{position:absolute;inset-inline:0;bottom:0;margin:0;padding:48px 20px 17px;background:linear-gradient(transparent,rgba(10,20,29,.62));color:white;font-size:12px;letter-spacing:.02em;pointer-events:none}.photo-status{position:absolute;top:13px;inset-inline-start:15px;color:#fff;background:#102942e8;padding:6px 11px;border-radius:3px}.photo-status:empty{display:none}.photo-status button{border:1px solid currentColor;color:inherit;background:none;margin-inline-start:8px}
@media(max-width:700px){header{height:58px;padding-inline:14px}.brand{font-size:17px;gap:7px}.brand img{width:30px;height:30px}.return{font-size:12px;padding:8px}.lang{font-size:14px}.head-actions{gap:12px}main{min-height:calc(100svh - 58px);padding:0;gap:0;display:flex;flex-direction:column}figure{order:0;min-height:0;height:clamp(300px,52svh,640px);flex:none}.credit{padding:36px 16px 10px}aside{order:1;padding:20px 18px 18px}.eyebrow{margin:0 0 8px;font-size:10px}.eyebrow::before{width:22px}h1{font-size:36px;margin:0 0 6px}.description{max-width:none;font-size:14px}.views{margin:17px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.views button{min-height:49px;font-size:13px;gap:7px}.thumb{width:36px;height:27px}.views button[aria-pressed=true]::after{padding:1px;font-size:7px}}
@media(prefers-reduced-motion:no-preference){.views button:hover{background:#eae6dc}}
</style>
</head>
<body>
<header>
<a class="brand" href="/gallery/" aria-label="Hammami Marble"><img src="/brand/hammami/favicon-32.png" width="38" height="38" alt="">HAMMAMI</a>
<div class="head-actions"><button class="lang" type="button" data-language lang="ar">العربية</button><a class="return" href="/gallery/" data-return>Explore in 3D</a></div>
</header>
<main>
<aside><p class="eyebrow" id="section">On location</p>
<h1 id="title">The slab yard</h1>
<p id="description" class="description">Rows of marble and granite sit beneath the yard’s overhead crane.</p>
<nav class="views" aria-label="Site photographs">
<button type="button" data-view="yard" aria-pressed="true"><span class="thumb" aria-hidden="true" style="background-position:0%"></span><span>The slab yard</span></button>
<button type="button" data-view="gate" aria-pressed="false"><span class="thumb" aria-hidden="true" style="background-position:33.3333%"></span><span>The showroom</span></button>
<button type="button" data-view="racks" aria-pressed="false"><span class="thumb" aria-hidden="true" style="background-position:66.6667%"></span><span>Under the gantry</span></button>
<button type="button" data-view="stone" aria-pressed="false"><span class="thumb" aria-hidden="true" style="background-position:100%"></span><span>At the racks</span></button>
</nav></aside>
<figure><picture><img alt="An elevated view of Hammami Marble’s slab yard and gantry crane" width="1080" height="1920" fetchpriority="high"></picture>
<div class="photo-status" role="status"></div><figcaption class="credit">Photographed at Hammami Marble</figcaption></figure>
</main>
<noscript><style>figure,.views,.lang{display:none}</style><img style="width:min(100%,720px);display:block;margin:auto" src="site-photos/yard-512.webp" alt="Hammami slab yard"></noscript>
<script>
const views={
 yard:{en:['The slab yard','Rows of marble and granite sit beneath the yard’s overhead crane.'],ar:['ساحة الألواح','صفوف الرخام والغرانيت تمتد تحت الرافعة الجسرية في الساحة.'],focus:57,route:'yard'},
 gate:{en:['The showroom','The company sign overlooks the steps and forecourt at the showroom entrance.'],ar:['واجهة المعرض','تعلو لافتة الشركة الدرج والساحة الأمامية عند مدخل المعرض.'],focus:54,route:'site'},
 racks:{en:['Under the gantry','From the crane rail, you can see how the stone is stacked along the working aisle.'],ar:['تحت الرافعة','من مسار الرافعة تظهر الألواح المرصوصة على جانبي ممر العمل.'],focus:60,route:'yard'},
 stone:{en:['At the racks','A closer look at the faces, edges and natural colour of the slabs.'],ar:['بين الألواح','نظرة قريبة إلى أسطح الألواح وحوافها وألوان الحجر الطبيعية.'],focus:69,route:'yard'}
};
const picture=document.querySelector('picture'),buttons=[...document.querySelectorAll('[data-view]')],nav=document.querySelector('.views');
const title=document.querySelector('#title'),desc=document.querySelector('#description'),status=document.querySelector('.photo-status');
const language=document.querySelector('[data-language]'),back=document.querySelector('[data-return]');
const url=new URL(location.href);let chosen,requestedSource,request=0,lang=url.searchParams.get('lang')==='ar'?'ar':'en';
function words(en,ar){return lang==='ar'?ar:en;}
function localize(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 language.textContent=words('العربية','English');language.lang=words('ar','en');
 document.querySelector('#section').textContent=words('On location','من الموقع');
 document.querySelector('.credit').textContent=words('Photographed at Hammami Marble','تصوير من موقع شركة حمامي للرخام');
 nav.setAttribute('aria-label',words('Site photographs','صور الموقع'));
 back.textContent=words('Explore in 3D','استكشف ثلاثي الأبعاد');
 buttons.forEach(b=>b.lastElementChild.textContent=views[b.dataset.view][lang][0]);
}
function show(reset=false){
 const id=Object.prototype.hasOwnProperty.call(views,location.hash.slice(1))?location.hash.slice(1):'yard',v=views[id];
 title.textContent=v[lang][0];desc.textContent=v[lang][1];document.title=v[lang][0]+words(' · Hammami Marble',' · رخام حمامي');
 back.setAttribute('href','/gallery/?view='+v.route+(lang==='ar'?'&lang=ar':''));
 document.querySelector('.brand').href='/gallery/'+(lang==='ar'?'?lang=ar':'');
 buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===id)));
 const small='site-photos/'+id+'-512.webp',large='site-photos/'+id+'-1080.webp';
 const constrained=navigator.connection?.saveData||/^(slow-)?2g$/.test(navigator.connection?.effectiveType||'');
 const pixels=Math.max(picture.clientWidth,picture.clientHeight*9/16)*(devicePixelRatio||1);
 const source=constrained||pixels<=512?small:large;
 if(chosen===id&&requestedSource===source&&!reset){picture.querySelector('img').alt=v[lang].join('. ');return;}
 chosen=id;requestedSource=source;const intent=++request;
 picture.setAttribute('aria-busy','true');status.textContent=words('Loading photograph…','جارٍ تحميل الصورة…');
 const next=new Image(1080,1920);next.fetchPriority='high';next.decoding='async';
 next.alt=v[lang].join('. ');next.style.setProperty('--focus',v.focus+'%');
 picture.replaceChildren(next);
 next.onload=()=>{if(intent!==request)return;picture.setAttribute('aria-busy','false');status.replaceChildren();};
 next.onerror=()=>{if(intent!==request)return;
  if(next.src.endsWith(large)){next.src=small;return;}
  picture.setAttribute('aria-busy','false');status.textContent=words('Photo unavailable.','تعذّر تحميل الصورة.');
  const retry=document.createElement('button');retry.textContent=words('Retry','أعد المحاولة');retry.onclick=()=>show(true);status.append(retry);
 };
 next.src=source;
}
buttons.forEach(b=>b.onclick=()=>{location.hash=b.dataset.view;show();});
language.onclick=()=>{lang=words('ar','en');const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);localize();show();};
window.addEventListener('hashchange',()=>show());window.addEventListener('resize',()=>show());localize();show();
</script>
</body>
</html>
